services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusbite
      POSTGRES_USER: campusbite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusbite_local}
    volumes:
      - campusbite_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusbite -d campusbite"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      DATABASE_URL: postgresql+psycopg://campusbite:${POSTGRES_PASSWORD:-campusbite_local}@db:5432/campusbite
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      TOKEN_EXPIRE_MINUTES: ${TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      db:
        condition: service_healthy
volumes:
  campusbite_db:
